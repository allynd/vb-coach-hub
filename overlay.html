<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#00000000">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Coach Hub Live Score</title>
  <link rel="stylesheet" href="./overlay.css?v=15.27">
</head>
<body>
  <main id="overlay" class="overlay-shell waiting" aria-live="polite">
    <section class="score-widget">
      <div class="timeout-banner" id="timeoutBanner" hidden>
        <span>TIMEOUT</span>
        <strong id="timeoutTeam">TEAM</strong>
      </div>
      <div class="broadcast-badge">
        <span class="broadcast-dot"></span>
        <span id="liveLabel">LIVE</span>
      </div>

      <div class="team-side home-side">
        <div class="logo-wrap">
          <div class="logo-glow"></div>
          <div class="logo-box"><img id="homeLogo" alt=""><span id="homeFallback">V</span></div>
        </div>
        <div class="team-copy">
          <div class="team-name" id="homeName">TEAM</div>
          <div class="team-meta">
            <span class="sets-mini">SETS <strong id="homeSets">0</strong></span>
            <span class="serve-inline" id="homeServe">SERVING</span>
          </div>
        </div>
        <div class="score-tile"><div class="score" id="homeScore">0</div></div>
      </div>

      <div class="match-center">
        <div class="set-caption">CURRENT</div>
        <div class="set-label" id="setLabel">SET 1</div>
      </div>

      <div class="team-side away-side">
        <div class="score-tile"><div class="score" id="awayScore">0</div></div>
        <div class="team-copy">
          <div class="team-name" id="awayName">OPPONENT</div>
          <div class="team-meta">
            <span class="serve-inline" id="awayServe">SERVING</span>
            <span class="sets-mini">SETS <strong id="awaySets">0</strong></span>
          </div>
        </div>
        <div class="logo-wrap">
          <div class="logo-glow"></div>
          <div class="logo-box"><img id="awayLogo" alt=""><span id="awayFallback">O</span></div>
        </div>
      </div>

      <div class="set-history" id="setHistory">Waiting for live score…</div>
      <div class="feed-status" id="feedStatus"></div>
    </section>
  </main>
  <script type="module" src="./overlay.js?v=15.27"></script>
</body>
</html>
