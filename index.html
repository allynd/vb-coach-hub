<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach Hub" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Volleyball Coach Hub</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="./coach.css?v=12" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-team">
        <div id="headerLogo" class="header-logo-slot"></div>
        <div>
          <div class="eyebrow">VOLLEYBALL</div>
          <h1 id="headerTitle">Coach Hub</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="offlineBadge" class="badge">Offline ready</span>
        <button id="quickNewGame" class="btn primary compact">New Match</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="Coach Hub navigation">
      <button class="nav-btn active" data-view="dashboard"><span>⌂</span><small>Home</small></button>
      <button class="nav-btn" data-view="gameday"><span>🏐</span><small>Game Day</small></button>
      <button class="nav-btn" data-view="roster"><span>👥</span><small>Roster</small></button>
      <button class="nav-btn" data-view="players"><span>★</span><small>Players</small></button>
      <button class="nav-btn" data-view="stats"><span>▥</span><small>Stats</small></button>
      <button class="nav-btn" data-view="games"><span>☷</span><small>Games</small></button>
      <button class="nav-btn" data-view="team"><span>⚙</span><small>Team</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-shell">
      <div class="modal-head">
        <h2 id="modalTitle">Edit</h2>
        <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
      </div>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <input id="backupImport" type="file" accept="application/json,.json,.vball" hidden />
  <script type="module" src="./coach.js?v=12"></script>
  <script type="module" src="./history-delete.js?v=12"></script>
  <script type="module" src="./manual-results.js?v=12"></script>
  <script type="module" src="./conference.js?v=12"></script>
  <script type="module" src="./cloud.js?v=12"></script>
  <script type="module" src="./update-manager.js?v=12"></script>
</body>
</html>
