name: Film analysis tests
on:
  pull_request:
  push:
    branches: [feature/film-analysis-review]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s film-worker -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: film-browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
